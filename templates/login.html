{% extends 'base.html' %}

{% block title %}管理員登入{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-10 col-md-8 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
        <div class="p-4 p-sm-5 bg-white">
          <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
              <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark">管理員登入</h3>
            <p class="text-muted small">請輸入後台管理憑證以存取訂單系統</p>
          </div>

          <!-- 登入表單 -->
          <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold text-secondary small">管理員帳號</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="請輸入帳號" required autofocus value="admin">
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold text-secondary small">登入密碼</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="請輸入密碼" required autocomplete="current-password">
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fs-6 fw-semibold shadow-sm rounded-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> 立即登入
            </button>
          </form>

          <!-- 系統安全憑證說明區塊 (程式與畫面均無明碼密碼) -->
          <div class="mt-4 p-3 bg-light rounded-3 border">
            <div class="d-flex align-items-center mb-1">
              <span class="small fw-semibold text-dark"><i class="bi bi-shield-check me-1 text-primary"></i> 系統安全憑證</span>
            </div>
            <div class="small text-muted">
              <div>管理員預設帳號：<code>admin</code></div>
              <div class="text-secondary small mt-1">
                <i class="bi bi-lock-fill me-1"></i> 密碼採 Werkzeug 安全雜湊保護，程式碼與前端畫面皆無明碼。
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
